{% extends "base.html" %}
{% block title %}All coins{% endblock %}

{% block content %}
<div class="page-head">
    <div>
        <h1>All coins</h1>
        <p>{{ symbols|length }} assets with daily history in the database</p>
    </div>
    <input class="search" type="search" placeholder="Search coin…" data-filter=".tiles .tile" aria-label="Search coin">
</div>

<div class="tiles">
    {% for s in symbols %}
    <a class="tile" href="/coin?symbol={{ s }}" data-search="{{ (s ~ ' ' ~ coin_name(s))|lower }}">
        <span class="coin">
            {{ coin_icon(s) }}
            <span><div class="coin-name">{{ coin_name(s) }}</div><div class="coin-sym">{{ s }}</div></span>
        </span>
        <span class="arrow">→</span>
    </a>
    {% endfor %}
</div>
{% endblock %}
