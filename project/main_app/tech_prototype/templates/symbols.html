<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="UTF-8" />
  <title>Supported Symbols</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        margin:0;
        background:#f3f5fa;
        color:#222;
    }
    .navbar {
        background: #ffffff;
        border-bottom: 1px solid #ccc;
        padding: 15px 30px;
        display: flex;
        align-items: center;
        gap: 25px;
    }
    .logo {
        font-size: 22px;
        font-weight: bold;
        margin-right: 40px;
    }
    .navbar a {
        text-decoration: none;
        color: #333;
        font-size: 16px;
        font-weight: 500;
    }
    .container {
        max-width: 900px;
        margin: 24px auto;
        padding: 0 16px;
    }
    .panel {
        background:#fff;
        padding:14px;
        border-radius:10px;
        box-shadow:0 1px 6px rgba(0,0,0,0.04);
    }
    ul {
        columns: 4;
        -webkit-columns: 4;
        -moz-columns: 4;
    }
    li {
        padding: 4px 0;}
    @media (max-width: 900px) { ul {columns: 2;} }
    @media (max-width: 520px) { ul {columns: 1;} }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="logo">APP Logo</div>
    <a href="/">Dashboard</a>
    <a href="/compare">Compare</a>
    <a href="/symbols">Symbols</a>
  </div>

  <div class="container">
    <div class="panel">
      <h2>All supported symbols ({{ symbols|length }})</h2>
      <ul>
        {% for s in symbols %}
          <li><a href="/coin?symbol={{ s }}">{{ s }}</a></li>
        {% endfor %}
      </ul>
    </div>
  </div>
</body>
</html>
