<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %} · Dians Crypto Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236c8cff'/%3E%3Cpath d='M8 21l5-6 4 3 7-8' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <a href="/" class="brand">
            <span class="brand-mark">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l5-6 4 3 7-8"/></svg>
            </span>
            <span>Dians<small>Crypto Analytics</small></span>
        </a>
        <nav class="nav">
            <a href="/" class="{{ 'active' if request.path in ['/', '/coin', '/analysis', '/lstm_train', '/lstm_forecast'] }}">Markets</a>
            <a href="/compare" class="{{ 'active' if request.path == '/compare' }}">Compare</a>
            <a href="/symbols" class="{{ 'active' if request.path == '/symbols' }}">All coins</a>
        </nav>
        <div class="topbar-right">
            <span class="status-dot">Live data · CoinGecko</span>
        </div>
    </div>
</header>

<main class="page">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <div class="footer-inner">
        <span>Dians Crypto Analytics · Flask · PostgreSQL · Docker · Kubernetes</span>
        <span>Data: CoinGecko API · Не е финансиски совет</span>
    </div>
</footer>

<div class="toast" id="fetch-toast" role="status" aria-live="polite">
    <div class="toast-title"><span class="spinner"></span> Повлекување податоци</div>
    <div class="toast-text">Започнувам…</div>
    <div class="progress"><span></span></div>
</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
