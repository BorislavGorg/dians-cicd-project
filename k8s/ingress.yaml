apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dians-ingress
  namespace: dians-crypto
  labels:
    app.kubernetes.io/part-of: dians-crypto-analytics
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: dians.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: main-app-service
                port:
                  number: 80
