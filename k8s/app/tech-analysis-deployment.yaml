apiVersion: apps/v1
kind: Deployment
metadata:
  name: technical-analysis-service
  namespace: dians-crypto
  labels:
    app: technical-analysis-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: technical-analysis-service
  template:
    metadata:
      labels:
        app: technical-analysis-service
    spec:
      containers:
        - name: technical-analysis-service
          image: borislavgorg/dians-technical-analysis-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5002
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
